#!/bin/sh

# Temp directory.  Used by Ghostscript
TISTMPDIR=/tmp
export TISTMPDIR

# Where did you install tis-clone?
BASE=$HOME/tis-clone

# Where should configs be stored?
CONFIG_DIR=$HOME/.tis

# HTTP cookie file location used to cache authentication
COOKIES=$CONFIG_DIR/cookies.txt

# Where are your tis-clone scripts?
SCRIPT_BASE=${BASE}/scripts

# Where do you want to download the files?
DOWNLOAD_TO=$HOME/tis-download

# Downloads go through scripts/tis-fetch.py, which writes rotated session cookies back to $COOKIES.  Older
# configs may still define WG and WG_NOMIRROR (wget command lines); nothing uses them now.

# Seconds tis-fetch.py waits between requests (0.01 if not set).  If TIS starts logging you out as having
# duplicate sessions (issue #11), slow it down, ie: 0.5.
TIS_WAIT=0.01

# Session ID sent with every document request (siid=).  When several people use the same stock value,
# TIS can treat downloads as a concurrent login and start serving error pages (issue #11).  setup.sh
# writes a random value into ~/.tis/tis-clone.cfg; any 13-digit number works.
SIID=1520435234586

# If you have an existing website that you want to merge your download into, provide the folder here.  
# If you are planning to copy the download to another computer, you should use the working (download) folder
FSM_URLBASE=${DOWNLOAD_TO}/techinfo.toyota.com

# Site where you registered for access to the FSM documents
WEBSITE="https://techinfo.toyota.com"

# If you have a public website for browsing the FSM, its address.  PDF links to other manuals (ie: from the
# repair manual to a wiring diagram) point there; with the default they're left out of the PDFs.
MYURL="http://localhost"

# Only used by some older helper scripts (tis-pdfer.sh, tis-html2pdf2.sh)
MYURL_BASE="/var/www/html/tis"

# Everything the scripts print is also appended to this log (default: $DOWNLOAD_TO/tis-clone.log)
#TIS_LOG=$DOWNLOAD_TO/tis-clone.log

# Optional: your TIS login, so tis-login.sh (and the downloaders when the session expires) only ask for
# the 2FA code.  If you set TIS_PASSWORD, make this file private: chmod 600 ~/.tis/tis-clone.cfg
#TIS_USERNAME="you@example.com"
#TIS_PASSWORD="your password"
#TIS_MFA=1		# 2FA code by 0 = email, 1 = text message
